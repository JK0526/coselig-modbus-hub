name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          enable-cache: true
      - run: uv sync --locked --python 3.14
      - run: uv run ruff check custom_components tests
      - run: uv run ruff format --check custom_components tests
      - run: node --test tests/frontend/monitor.test.cjs
      - run: uv run pytest --timeout=30 --cov-fail-under=99.5
      - name: Config flow coverage gate
        run: |
          uv run python - <<'PY'
          import json
          result = json.load(open('coverage.json'))
          flow = result['files']['custom_components/coselig_modbus_hub/config_flow.py']['summary']
          assert flow['missing_lines'] == 0 and flow['missing_branches'] == 0, flow
          PY
